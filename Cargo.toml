[package]
name = "oxide"
version = "0.2.0"
edition = "2021"
rust-version = "1.88"
description = "A super light text editor built in Rust"
license = "MIT"
repository = "https://github.com/edkranz/oxide"
homepage = "https://github.com/edkranz/oxide"
readme = "README.md"
keywords = ["editor", "text-editor", "gui"]
categories = ["text-editors"]
exclude = ["assets/", ".github/"]

[dependencies]
arboard = "3"
cosmic-text = "0.17.0"
interprocess = "2"
regex = "1"
rfd = "0.17.2"
ropey = "1.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
softbuffer = "0.4"
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
toml = { version = "1.1.8", default-features = false, features = ["parse", "serde"] }
unicode-segmentation = "1"
winit = "0.30"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true

# Regex-heavy highlighting is unusably slow unoptimised; keep dependencies fast in dev builds.
[profile.dev.package."*"]
opt-level = 2

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
muda = { version = "0.21", default-features = false }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSURL", "NSString"] }

[target."cfg(windows)".build-dependencies]
winresource = "0.1.34"
