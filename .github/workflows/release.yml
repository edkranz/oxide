name: Release

# Builds every platform's packages for a release tag and attaches them to its GitHub
# release, then points the Homebrew cask at the new version.
#
# release-please.yml calls this when it cuts a release. Run it by hand with an existing
# tag to rebuild that release's packages, or with a branch name (like main) to build
# the packages as workflow artifacts without publishing anything.
on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build, like v0.2.0 (or a branch, to build without publishing)
        type: string
        required: true

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag }}

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Build a universal binary
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          mkdir -p target/release
          lipo -create -output target/release/oxide \
            target/aarch64-apple-darwin/release/oxide target/x86_64-apple-darwin/release/oxide
      # With the Developer ID secrets set, the app is signed and notarized so Gatekeeper
      # opens it without a warning; without them it gets an ad-hoc signature.
      - name: Import the Developer ID certificate
        id: sign
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$CERTIFICATE" ]; then
            echo "No MACOS_CERTIFICATE secret; signing ad hoc"
            echo "identity=-" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(openssl rand -hex 16)
          echo "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/certificate.p12"
          identity=$(security find-identity -v -p codesigning "$keychain" | awk -F'"' '/Developer ID Application/ { print $2; exit }')
          [ -n "$identity" ] || { echo "MACOS_CERTIFICATE has no Developer ID Application identity" >&2; exit 1; }
          echo "identity=$identity" >> "$GITHUB_OUTPUT"
      - name: Bundle
        env:
          OXIDE_SIGN_IDENTITY: ${{ steps.sign.outputs.identity }}
        run: |
          OXIDE_SKIP_BUILD=1 scripts/install-macos.sh --bundle-only
          codesign --verify --strict --verbose=2 target/release/Oxide.app
          mkdir -p dist
          ditto -c -k --keepParent target/release/Oxide.app dist/Oxide-macos-universal.zip
      - name: Notarize
        if: steps.sign.outputs.identity != '-'
        env:
          API_KEY: ${{ secrets.APPLE_API_KEY }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          echo "$API_KEY" | base64 --decode > "$RUNNER_TEMP/api-key.p8"
          xcrun notarytool submit dist/Oxide-macos-universal.zip --wait --timeout 30m \
            --key "$RUNNER_TEMP/api-key.p8" --key-id "$API_KEY_ID" --issuer "$API_ISSUER"
          rm "$RUNNER_TEMP/api-key.p8"
          # Staple the ticket so the app opens offline too, then zip the stapled app.
          xcrun stapler staple target/release/Oxide.app
          spctl --assess --type execute --verbose target/release/Oxide.app
          rm dist/Oxide-macos-universal.zip
          ditto -c -k --keepParent target/release/Oxide.app dist/Oxide-macos-universal.zip
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: dist/*

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/oxide | Out-Null
          Copy-Item target/release/oxide.exe, packaging/windows/ox.cmd, README.md, LICENSE dist/oxide/
          Compress-Archive -Path dist/oxide -DestinationPath dist/Oxide-windows-x64.zip
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/*.zip

  linux:
    strategy:
      matrix:
        include:
          # Built on the oldest supported Ubuntu, so the binary runs on any glibc since.
          - { runner: ubuntu-22.04, arch: x64, deb: amd64 }
          - { runner: ubuntu-22.04-arm, arch: arm64, deb: arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - name: Package
        run: |
          mkdir -p dist/oxide
          cp target/release/oxide packaging/linux/oxide.desktop packaging/linux/oxide.png \
            scripts/install-linux.sh README.md LICENSE dist/oxide/
          tar -C dist -czf dist/Oxide-linux-${{ matrix.arch }}.tar.gz oxide
          rm -r dist/oxide
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          scripts/package-deb.sh target/release/oxide "$version" ${{ matrix.deb }} dist
      - uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*

  publish:
    if: startsWith(inputs.tag, 'v')
    needs: [macos, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
      - uses: actions/upload-artifact@v7
        with:
          name: checksums
          path: dist/SHA256SUMS.txt

  homebrew:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: checksums
      - name: Check for the tap's deploy key
        id: key
        env:
          KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: echo "present=$([ -n "$KEY" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.key.outputs.present == 'true'
        with:
          repository: edkranz/homebrew-tap
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          path: tap
      - name: Update the cask
        if: steps.key.outputs.present == 'true'
        run: |
          version="${TAG#v}"
          sha=$(awk '$2 == "Oxide-macos-universal.zip" { print $1 }' SHA256SUMS.txt)
          cd tap
          sed -i -E "s/^  version \".*\"/  version \"$version\"/; s/^  sha256 \".*\"/  sha256 \"$sha\"/" Casks/oxide.rb
          git diff
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "oxide $version" || exit 0
          git push
