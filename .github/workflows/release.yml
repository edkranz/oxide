name: Release

# Builds every platform's packages for a release tag and attaches them to its GitHub
# release, then points the Homebrew cask at the new version.
#
# release-please.yml calls this when it cuts a release. Run it by hand with an existing
# tag to rebuild that release's packages, or with a branch name (like main) to build
# the packages as workflow artifacts without publishing anything.
on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build, like v0.2.0 (or a branch, to build without publishing)
        type: string
        required: true

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag }}

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Build a universal binary
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          mkdir -p target/release
          lipo -create -output target/release/oxide \
            target/aarch64-apple-darwin/release/oxide target/x86_64-apple-darwin/release/oxide
      - name: Bundle
        run: |
          OXIDE_SKIP_BUILD=1 scripts/install-macos.sh --bundle-only
          mkdir -p dist
          ditto -c -k --keepParent target/release/Oxide.app dist/Oxide-macos-universal.zip
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/oxide | Out-Null
          Copy-Item target/release/oxide.exe, packaging/windows/ox.cmd, README.md, LICENSE dist/oxide/
          Compress-Archive -Path dist/oxide -DestinationPath dist/Oxide-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.zip

  linux:
    strategy:
      matrix:
        include:
          # Built on the oldest supported Ubuntu, so the binary runs on any glibc since.
          - { runner: ubuntu-22.04, arch: x64, deb: amd64 }
          - { runner: ubuntu-22.04-arm, arch: arm64, deb: arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - name: Package
        run: |
          mkdir -p dist/oxide
          cp target/release/oxide packaging/linux/oxide.desktop packaging/linux/oxide.png \
            scripts/install-linux.sh README.md LICENSE dist/oxide/
          tar -C dist -czf dist/Oxide-linux-${{ matrix.arch }}.tar.gz oxide
          rm -r dist/oxide
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          scripts/package-deb.sh target/release/oxide "$version" ${{ matrix.deb }} dist
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*

  publish:
    if: startsWith(inputs.tag, 'v')
    needs: [macos, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
      - uses: actions/upload-artifact@v4
        with:
          name: checksums
          path: dist/SHA256SUMS.txt

  homebrew:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: checksums
      - name: Check for the tap's deploy key
        id: key
        env:
          KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: echo "present=$([ -n "$KEY" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.key.outputs.present == 'true'
        with:
          repository: edkranz/homebrew-tap
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          path: tap
      - name: Update the cask
        if: steps.key.outputs.present == 'true'
        run: |
          version="${TAG#v}"
          sha=$(awk '$2 == "Oxide-macos-universal.zip" { print $1 }' SHA256SUMS.txt)
          cd tap
          sed -i -E "s/^  version \".*\"/  version \"$version\"/; s/^  sha256 \".*\"/  sha256 \"$sha\"/" Casks/oxide.rb
          git diff
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "oxide $version" || exit 0
          git push
